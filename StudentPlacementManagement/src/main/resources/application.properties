spring.application.name=StudentPlacementManagement

spring.profiles.active=dev
spring.main.log-startup-info=true
logging.level.org.springframework.boot=INFO

# Mysql Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/placement_db?useSSL=false
spring.datasource.username=root
spring.datasource.password=1008
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql: true
spring.jpa.properties.hibernate.format_sql=true

#Swagger UI configure
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

#Logger configuration
logging.level.root= INFO
logging.level.com.springboot.placement=DEBUG
logging.file.name=PlacementApplication.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
 
#Actuator configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Student Placement Management
info.app.description=Spring Boot Placement Management System
info.app.version=1.0.0

# Hikari configuration
spring.datasource.hikari.pool-name=PlacementPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Server
server.port=8080
